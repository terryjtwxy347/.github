    <style>
:root {
  --st-ink: #1e293b;
  --st-dim: #64748b;
  --st-quiet: #94a3b8;
  --st-ghost: #cbd5e1;
  --st-rail: #eef1f4;
  --card: #ffffff;
  --violet: #7c3aed;
  --violet-deep: #6d28d9;
  --blue: #3b82f6;
  --st-pass: #059669;
  --st-lift: 0 9px 23px rgba(15, 23, 42, 0.075);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;
  color:var(--st-ink);
  background:radial-gradient(1180px 510px at 50% -9%,#f4f2ff 0%,transparent 56%),#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:47px 21px 118px;overflow-x:hidden;position:relative;
}
body::after{
  content:"";position:absolute;inset:auto 0 0 0;height:178px;pointer-events:none;
  background-image:radial-gradient(circle,rgba(124,58,237,.17) 1.2px,transparent 1.4px);
  background-size:13px 13px;
  mask-image:linear-gradient(to top,rgba(0,0,0,.52),transparent 84%);
  -webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.52),transparent 84%);
}
.st-frame{
  width:100%;max-width:916px;display:flex;flex-direction:column;align-items:center;
  text-align:center;gap:29px;position:relative;z-index:1;
}
.st-brand{
  width:111px;height:111px;border-radius:999px;background:#fff;box-shadow:var(--st-lift);
  display:grid;place-items:center;overflow:hidden;
}
.st-brand svg{width:91%;height:91%;fill:#24292f;transform:scale(1.07)}
.st-heading{font-size:33px;font-weight:700;letter-spacing:-.021em;line-height:1.21}
.st-lead{margin-top:-15px;font-size:15px;color:var(--st-dim)}
.st-track-wrap{width:min(516px,100%);margin-top:7px}
.st-track{height:9px;border-radius:999px;background:var(--st-rail);overflow:hidden}
.st-track>i{
  display:block;height:100%;width:0;border-radius:inherit;
  background:linear-gradient(90deg,var(--violet),var(--blue));
  transition:width .17s linear;
}
.st-banner{
  margin-top:11px;font-size:14px;color:var(--st-dim);
  display:inline-flex;align-items:center;gap:7px;min-height:21px;
}
.st-banner .st-mark{color:var(--st-pass);font-weight:700}
.st-lane{
  width:100%;margin-top:17px;display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));gap:17px;
}
.st-slot{
  display:flex;flex-direction:column;align-items:center;gap:9px;
  min-width:0;color:var(--st-quiet);
}
.st-glyph{
  width:57px;height:57px;border-radius:13px;background:var(--card);box-shadow:var(--st-lift);
  display:grid;place-items:center;position:relative;color:var(--st-ghost);
}
.st-glyph svg{
  width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.75;
  stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1;
}
.st-caption{font-size:13px;font-weight:600;color:inherit}
.st-digest{
  font-size:11px;color:var(--st-quiet);display:inline-flex;align-items:center;justify-content:center;
  gap:5px;font-variant-numeric:tabular-nums;min-height:14px;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.st-digest .st-mark{color:var(--st-pass);font-weight:700}
.st-slot.hold{color:var(--st-quiet)}
.st-slot.hold .st-glyph{color:var(--st-ghost)}
.st-slot.work{color:var(--violet-deep)}
.st-slot.work .st-glyph{color:var(--violet)}
.st-slot.work .st-digest{color:var(--st-dim)}
.st-slot.ok{color:#64748b}
.st-slot.ok .st-glyph{color:#94a3b8}
.st-slot.ok .st-digest{color:var(--st-quiet)}
.st-slot[data-slot="gate"].work .st-glyph{animation:stGatePulse 1.05s ease-in-out infinite}
.st-slot[data-slot="gate"].work .st-glyph::after{
  content:"";position:absolute;inset:-4px;border-radius:17px;
  border:1.5px solid rgba(124,58,237,.42);animation:stGateRing 1.05s ease-in-out infinite;
}
@keyframes stGatePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes stGateRing{0%,100%{opacity:.32}50%{opacity:1}}
.st-beam{
  display:none;position:absolute;left:9px;right:9px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--violet),transparent);z-index:2;
  animation:stBeamSlide 1.2s linear infinite;
}
.st-slot[data-slot="scan"].work .st-beam{display:block}
@keyframes stBeamSlide{0%{top:9px;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:45px;opacity:0}}
.st-orbit{display:none;position:absolute;inset:-11px;pointer-events:none}
.st-orbit .st-o1,.st-orbit .st-o2{position:absolute;inset:0;border-radius:999px;border:2px dashed rgba(124,58,237,.33)}
.st-orbit .st-o2{
  inset:6px;border-style:solid;border-color:transparent;
  border-top-color:rgba(124,58,237,.52);border-right-color:rgba(124,58,237,.18);
}
.st-slot[data-slot="build"].work .st-orbit{display:block}
.st-slot[data-slot="build"].work .st-orbit .st-o1{animation:stOrbitCW 3.4s linear infinite}
.st-slot[data-slot="build"].work .st-orbit .st-o2{animation:stOrbitCCW 5.1s linear infinite}
.st-slot[data-slot="build"].work .st-glyph svg{animation:stBuildThrob 1.35s ease-in-out infinite}
@keyframes stOrbitCW{to{transform:rotate(360deg)}}
@keyframes stOrbitCCW{to{transform:rotate(-360deg)}}
@keyframes stBuildThrob{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.055);opacity:.82}}
.st-beats{display:none;gap:5px;align-items:center;height:12px}
.st-slot[data-slot="build"].work .st-beats{display:inline-flex}
.st-beats i{width:5px;height:5px;border-radius:50%;background:#ddd6fe}
.st-beats i.st-hot{background:var(--violet)}
.st-lanes{
  display:none;position:absolute;left:17px;right:17px;top:13px;bottom:13px;
  flex-direction:column;justify-content:space-between;z-index:2;pointer-events:none;
}
.st-lanes b{display:block;height:3px;border-radius:2px;background:rgba(124,58,237,.16)}
.st-slot[data-slot="pull"].work .st-lanes{display:flex}
.st-slot[data-slot="pull"].work .st-lanes b{animation:stLaneFlash .95s ease-in-out infinite}
.st-slot[data-slot="pull"].work .st-lanes b:nth-child(2){animation-delay:.14s}
.st-slot[data-slot="pull"].work .st-lanes b:nth-child(3){animation-delay:.28s}
.st-slot[data-slot="pull"].work .st-lanes b:nth-child(4){animation-delay:.42s}
@keyframes stLaneFlash{0%,100%{background:rgba(124,58,237,.14)}50%{background:rgba(124,58,237,.82)}}
.st-ring{display:none;position:absolute;inset:7px;z-index:0}
.st-ring svg{width:100%;height:100%}
.st-ring .st-base{stroke:#ede9fe;fill:none;stroke-width:2.4}
.st-ring .st-run{
  stroke:var(--violet);fill:none;stroke-width:2.4;stroke-linecap:round;
  stroke-dasharray:100;stroke-dashoffset:100;transform:rotate(-90deg);transform-origin:50% 50%;
  transition:stroke-dashoffset .14s linear;
}
.st-spin{
  display:none;position:absolute;inset:13px;border-radius:999px;border:2px solid transparent;
  border-top-color:rgba(124,58,237,.52);animation:stOrbitCW .95s linear infinite;z-index:0;
}
.st-slot[data-slot="close"].work .st-ring,
.st-slot[data-slot="close"].work .st-spin{display:block}
@media (max-width:860px){
  .st-heading{font-size:27px}
  .st-lane{grid-template-columns:repeat(2,minmax(0,1fr));gap:21px 13px}
  .st-slot:last-child{grid-column:1/-1}
}
@media (max-width:480px){
  .st-lane{grid-template-columns:1fr}
  .st-slot:last-child{grid-column:auto}
  .st-heading{font-size:23px}
}
